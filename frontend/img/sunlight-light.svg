<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <!-- Window light and leaf shadows, light-wall version for paper sections -->
  <style>
    .leaves { fill: #2b2a26; stroke: #2b2a26; opacity: 0.14; }
    .leaves .stem { fill: none; stroke-width: 6; }
    .a { transform-origin: 120px 0; animation: sway 9s ease-in-out infinite; }
    .b { transform-origin: 1440px 40px; animation: sway 11s ease-in-out -3s infinite; }
    @keyframes sway { 50% { transform: rotate(2.4deg); } }
    @media (prefers-reduced-motion: reduce) { .a, .b { animation: none; } }
  </style>
  <defs>
    <filter id="sun-soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="7" /></filter>
    <filter id="leaf-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5" /></filter>
  </defs>
  <g fill="#fffbf2" opacity="0.9" filter="url(#sun-soft)" transform="translate(330 70) skewX(-16)">
    <rect x="0" y="0" width="250" height="300" />
    <rect x="268" y="0" width="250" height="300" />
    <rect x="0" y="318" width="250" height="300" />
    <rect x="268" y="318" width="250" height="300" />
  </g>
  <g class="leaves a" filter="url(#leaf-soft)">
    <path class="stem" d="M120 -20 C 210 120, 300 200, 470 260" />
    <ellipse cx="190" cy="70" rx="56" ry="20" transform="rotate(38 190 70)" />
    <ellipse cx="245" cy="105" rx="60" ry="21" transform="rotate(-24 245 105)" />
    <ellipse cx="268" cy="168" rx="62" ry="22" transform="rotate(52 268 168)" />
    <ellipse cx="340" cy="190" rx="64" ry="22" transform="rotate(-10 340 190)" />
    <ellipse cx="372" cy="250" rx="58" ry="20" transform="rotate(40 372 250)" />
    <ellipse cx="450" cy="236" rx="54" ry="19" transform="rotate(-30 450 236)" />
  </g>
  <g class="leaves b" filter="url(#leaf-soft)">
    <path class="stem" d="M1500 40 C 1380 90, 1300 160, 1210 300" />
    <ellipse cx="1420" cy="60" rx="58" ry="20" transform="rotate(-28 1420 60)" />
    <ellipse cx="1370" cy="128" rx="62" ry="21" transform="rotate(30 1370 128)" />
    <ellipse cx="1300" cy="150" rx="60" ry="21" transform="rotate(-48 1300 150)" />
    <ellipse cx="1280" cy="226" rx="56" ry="19" transform="rotate(20 1280 226)" />
    <ellipse cx="1215" cy="262" rx="50" ry="18" transform="rotate(-60 1215 262)" />
  </g>
</svg>
